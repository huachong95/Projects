name: Backend CI

on:
  push:
    paths:
      - '3d-slicer/backend/**'
  pull_request:
    paths:
      - '3d-slicer/backend/**'

defaults:
  run:
    working-directory: 3d-slicer/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 3d-slicer/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v
