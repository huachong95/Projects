name: Flutter Windows Build

on:
  push:
    paths:
      - '3d-slicer/frontend/**'
  pull_request:
    paths:
      - '3d-slicer/frontend/**'

defaults:
  run:
    working-directory: 3d-slicer/frontend

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slicer-windows
          path: 3d-slicer/frontend/build/windows/x64/runner/Release/
          retention-days: 14
