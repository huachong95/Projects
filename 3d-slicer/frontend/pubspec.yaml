name: slicer_app
description: Cross-platform 3D printing slicer for Prusa Mk4

publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # Networking
  dio: ^5.4.3
  web_socket_channel: ^3.0.0

  # 3D viewer (WebView2 on Windows, WKWebView on iOS)
  flutter_inappwebview: ^6.0.0

  # File picking
  file_picker: ^8.0.3

  # Persistent settings (backend URL)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/viewer/
    - assets/icons/
