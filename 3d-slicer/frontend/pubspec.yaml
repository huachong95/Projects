name: slicer_app
description: Cross-platform 3D printing slicer for Prusa Mk4

publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.4

  # Networking
  dio: ^5.4.3
  web_socket_channel: ^3.0.0

  # 3D Viewer (WebView for Three.js)
  flutter_inappwebview: ^6.0.0

  # File handling
  file_picker: ^8.0.3
  desktop_drop: ^0.4.4
  path_provider: ^2.1.3

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0

  # Media
  video_player: ^2.8.7

  # Forms
  flutter_form_builder: ^9.3.0
  form_builder_validators: ^10.0.1

  # Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/viewer/
    - assets/icons/
